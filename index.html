<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Excel to Visual Canvas | Pure JavaScript Engine</title>
    <!-- SheetJS for parsing XLSX files directly in the browser -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <style>
        :root {
            --bg-dark: #272822;
            --bg-panel: #1e1f1c;
            --border-color: #3e3d32;
            --text-main: #f8f8f2;
            --text-muted: #75715e;
            --neon-pink: #f92672;
            --neon-green: #a6e22e;
            --neon-blue: #66d9ef;
            --neon-orange: #fd971f;
            --neon-yellow: #e6db74;
            --neon-purple: #ae81ff;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }

        body {
            font-family: Consolas, "Courier New", monospace;
            background-color: var(--bg-dark);
            color: var(--text-main);
            overflow: hidden;
        }

        /* Toolbar */
        .toolbar {
            position: absolute;
            top: 20px; left: 20px;
            background: rgba(30, 31, 28, 0.95);
            border: 1px solid var(--border-color);
            padding: 12px 18px;
            border-radius: 6px;
            z-index: 1000;
            display: flex;
            gap: 12px;
            align-items: center;
            backdrop-filter: blur(5px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.6);
        }

        button, label.upload-btn {
            background: #272822; color: var(--neon-green);
            border: 1px solid var(--border-color); padding: 6px 14px;
            font-family: inherit; font-size: 13px; cursor: pointer;
            border-radius: 4px; transition: color 0.2s, border-color 0.2s;
            display: inline-block; text-align: center;
        }
        button:hover, label.upload-btn:hover { color: var(--neon-pink); border-color: var(--neon-pink); }
        input[type="file"] { display: none; }

        /* Canvas & Viewport */
        #viewport {
            width: 100vw; height: 100vh;
            position: relative;
        }

        #canvas {
            position: absolute;
            top: 0; left: 0;
            width: 8000px; height: 8000px;
            transform-origin: 0 0;
            background-image: 
                linear-gradient(var(--border-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--border-color) 1px, transparent 1px);
            background-size: 40px 40px;
            background-position: -1px -1px;
            cursor: grab;
        }
        #canvas.panning { cursor: grabbing; }

        svg {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        path.wire {
            fill: none; stroke-width: 3; stroke-linecap: round;
            filter: drop-shadow(0 0 5px currentColor);
            pointer-events: visibleStroke;
            cursor: pointer;
            transition: stroke-width 0.2s;
        }
        path.wire:hover { stroke-width: 6; }

        /* Nodes (Tables) */
        .node {
            position: absolute;
            background-color: var(--bg-panel);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.6);
            min-width: 320px;
            z-index: 10;
            display: flex;
            flex-direction: column;
            cursor: default;
        }

        .node-header {
            background-color: #3e3d32; padding: 10px 14px; font-size: 13px;
            font-weight: bold; color: var(--neon-blue); cursor: grab;
            border-top-left-radius: 6px; border-top-right-radius: 6px;
            display: flex; justify-content: space-between; align-items: center;
        }
        .node-header:active { cursor: grabbing; }

        .node-content { padding: 10px; max-height: 450px; overflow-y: auto; }

        /* Rows & Cells */
        .row {
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 6px; position: relative; font-size: 12px;
        }

        .cell-label {
            color: var(--neon-orange); width: 65px; font-size: 11px;
            overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
        }

        .input-wrapper {
            display: flex; align-items: center; background: #272822;
            border: 1px solid var(--border-color); border-radius: 4px;
            padding: 2px 6px; flex-grow: 1; margin: 0 8px;
        }

        input {
            background: transparent; border: none; color: var(--neon-yellow);
            font-family: inherit; font-size: 12px; width: 100%; outline: none;
        }
        input:focus { color: var(--text-main); }

        /* Ports */
        .port {
            width: 12px; height: 12px; background-color: var(--border-color);
            border-radius: 50%; cursor: crosshair; position: absolute;
            transition: transform 0.2s, background-color 0.2s; pointer-events: auto;
        }
        .port:hover { transform: scale(1.6); }
        .port.in { left: -15px; border: 2px solid var(--bg-panel); }
        .port.out { right: -15px; border: 2px solid var(--bg-panel); }

        #status-msg {
            font-size: 12px; color: var(--neon-green); margin-left: 10px;
        }
    </style>
</head>
<body>

    <div class="toolbar">
        <span style="color: var(--text-muted);"><b>Excel2Canvas</b> (Pure JS)</span>
        <label class="upload-btn">
            📂 Load .xlsx Workbook
            <input type="file" id="excel-file" accept=".xlsx, .xls" onchange="handleExcelUpload(event)">
        </label>
        <span id="status-msg">Upload your spare parts Excel file to parse sheets & formulas</span>
    </div>

    <div id="viewport">
        <div id="canvas">
            <svg id="svg-canvas"></svg>
        </div>
    </div>

    <script>
        let connections = [];
        let wireCounter = 0;
        let cellPortMap = {}; 

        // Viewport Panning State
        let isPanning = false;
        let panStartX = 0, panStartY = 0;
        let panOffsetX = -300, panOffsetY = -200;
        const canvas = document.getElementById('canvas');
        const svg = document.getElementById('svg-canvas');
        const viewport = document.getElementById('viewport');
        canvas.style.transform = `translate(${panOffsetX}px, ${panOffsetY}px)`;

        // Dragging Nodes
        let isDraggingNode = false, dragTarget = null, nodeOffsetX = 0, nodeOffsetY = 0;
        // Drawing Wires
        let isDrawingWire = false, activeStartPort = null, mouseX = 0, mouseY = 0;

        viewport.addEventListener('mousedown', (e) => {
            if (e.button === 2 || e.target === viewport || e.target === canvas) {
                isPanning = true;
                panStartX = e.clientX - panOffsetX;
                panStartY = e.clientY - panOffsetY;
                canvas.classList.add('panning');
            }
        });
        window.addEventListener('contextmenu', e => e.preventDefault());

        document.addEventListener('mousedown', (e) => {
            if (e.button !== 0) return;
            if (e.target.classList.contains('node-header') || e.target.closest('.node-header')) {
                isDraggingNode = true;
                dragTarget = e.target.closest('.node-header').parentElement;
                const rect = dragTarget.getBoundingClientRect();
                nodeOffsetX = e.clientX - rect.left;
                nodeOffsetY = e.clientY - rect.top;
                dragTarget.style.zIndex = 100;
            } else if (e.target.classList.contains('port') && e.target.classList.contains('out')) {
                isDrawingWire = true;
                activeStartPort = e.target;
                updateMouse(e);
                renderWires();
            }
        });

        document.addEventListener('mousemove', (e) => {
            if (isPanning) {
                panOffsetX = e.clientX - panStartX;
                panOffsetY = e.clientY - panStartY;
                canvas.style.transform = `translate(${panOffsetX}px, ${panOffsetY}px)`;
            }
            if (isDraggingNode && dragTarget) {
                dragTarget.style.left = (e.clientX - nodeOffsetX - panOffsetX) + 'px';
                dragTarget.style.top = (e.clientY - nodeOffsetY - panOffsetY) + 'px';
                renderWires();
            }
            if (isDrawingWire) {
                updateMouse(e);
                renderWires();
            }
        });

        document.addEventListener('mouseup', (e) => {
            isPanning = false; canvas.classList.remove('panning');
            if (isDraggingNode) { isDraggingNode = false; if(dragTarget) dragTarget.style.zIndex = 10; dragTarget = null; }
            if (isDrawingWire) {
                isDrawingWire = false;
                if (e.target.classList.contains('port') && e.target.classList.contains('in')) {
                    const fromId = activeStartPort.getAttribute('data-id');
                    const toId = e.target.getAttribute('data-id');
                    const color = '#66d9ef';
                    e.target.style.backgroundColor = color;
                    activeStartPort.style.backgroundColor = color;
                    connections = connections.filter(c => c.to !== toId);
                    connections.push({ from: fromId, to: toId, color, index: wireCounter++ });
                    evaluateGraph();
                }
                activeStartPort = null;
                renderWires();
            }
        });

        svg.addEventListener('dblclick', (e) => {
            if (e.target.classList.contains('wire')) {
                const idx = parseInt(e.target.getAttribute('data-index'));
                connections = connections.filter(c => c.index !== idx);
                renderWires();
            }
        });

        function updateMouse(e) {
            mouseX = e.clientX - panOffsetX;
            mouseY = e.clientY - panOffsetY;
        }

        // --- EXCEL PARSING ENGINE USING SHEETJS ---
        function handleExcelUpload(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array', cellFormula: true, cellStyles: true });

                document.getElementById('status-msg').innerText = `Loaded: ${file.name} (${workbook.SheetNames.length} sheets parsed)`;
                
                document.querySelectorAll('.node').forEach(n => n.remove());
                connections = []; cellPortMap = {}; svg.innerHTML = '';

                let posX = 100, posY = 150;
                let sheetIndex = 0;

                workbook.SheetNames.forEach(sheetName => {
                    const worksheet = workbook.Sheets[sheetName];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: "" });
                    
                    createTableNode(sheetName, jsonRows, worksheet, posX, posY);
                    posX += 420;
                    if (++sheetIndex % 3 === 0) { posX = 100; posY += 550; }
                });

                autoDetectDependencies(workbook);
            };
            reader.readAsArrayBuffer(file);
        }

        function createTableNode(sheetName, rows, worksheet, x, y) {
            const nodeId = `node-${sheetName.replace(/\s+/g, '_')}`;
            let contentHTML = '';

            const maxRows = Math.min(rows.length, 18);
            for (let r = 0; r < maxRows; r++) {
                const rowVals = rows[r];
                if (!rowVals || rowVals.every(val => val === "")) continue;

                const cellAddress = XLSX.utils.encode_cell({ r: r, c: 0 }); 
                const cellVal = rowVals[0] !== undefined ? rowVals[0] : "";
                
                const inPortId = `port-in-${sheetName}-${r}`;
                const outPortId = `port-out-${sheetName}-${r}`;
                
                cellPortMap[`${sheetName}!${cellAddress}`] = outPortId;

                contentHTML += `
                    <div class="row">
                        <div class="port in" data-id="${inPortId}"></div>
                        <span class="cell-label">Row ${r+1}</span>
                        <div class="input-wrapper">
                            <input type="text" value="${cellVal}" data-cell="${sheetName}!${cellAddress}" oninput="evaluateGraph()">
                        </div>
                        <div class="port out" data-id="${outPortId}"></div>
                    </div>
                `;
            }

            const node = document.createElement('div');
            node.className = 'node';
            node.style.left = `${x}px`;
            node.style.top = `${y}px`;
            node.innerHTML = `
                <div class="node-header">
                    <span>📊 ${sheetName}</span>
                </div>
                <div class="node-content">${contentHTML}</div>
            `;
            canvas.appendChild(node);
        }

        function autoDetectDependencies(workbook) {
            workbook.SheetNames.forEach(sheetName => {
                const worksheet = workbook.Sheets[sheetName];
                for (let cellKey in worksheet) {
                    if (cellKey[0] === '!') continue;
                    const cell = worksheet[cellKey];
                    if (cell.f) { 
                        const formula = cell.f;
                        workbook.SheetNames.forEach(targetSheet => {
                            if (formula.includes(targetSheet) || sheetName === targetSheet) {
                                const matches = formula.match(/[A-Z]+\d+/g);
                                if (matches) {
                                    matches.forEach(matchCell => {
                                        const sourceKey = `${targetSheet}!${matchCell}`;
                                        const targetKey = `${sheetName}!${cellKey}`;
                                        
                                        const outPort = cellPortMap[sourceKey];
                                        const targetInput = document.querySelector(`input[data-cell="${targetKey}"]`);
                                        if (outPort && targetInput) {
                                            const rowEl = targetInput.closest('.row');
                                            const inPort = rowEl.querySelector('.port.in');
                                            if (inPort) {
                                                const inPortId = inPort.getAttribute('data-id');
                                                const color = '#a6e22e';
                                                inPort.style.backgroundColor = color;
                                                document.querySelector(`[data-id="${outPort}"]`).style.backgroundColor = color;
                                                
                                                connections.push({
                                                    from: outPort,
                                                    to: inPortId,
                                                    color: color,
                                                    index: wireCounter++
                                                });
                                            }
                                        }
                                    });
                                }
                            }
                        });
                    }
                }
            });
            renderWires();
        }

        function renderWires() {
            svg.innerHTML = '';
            connections.forEach(conn => {
                const fromEl = document.querySelector(`[data-id="${conn.from}"]`);
                const toEl = document.querySelector(`[data-id="${conn.to}"]`);
                if (fromEl && toEl) drawCurve(fromEl, toEl, conn.color, conn.index);
            });

            if (isDrawingWire && activeStartPort) {
                const rect = activeStartPort.getBoundingClientRect();
                const startX = rect.left + rect.width / 2 - panOffsetX;
                const startY = rect.top + rect.height / 2 - panOffsetY;
                const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
                const cp1x = startX + Math.abs(mouseX - startX) * 0.5;
                const cp2x = mouseX - Math.abs(mouseX - startX) * 0.5;
                path.setAttribute('d', `M ${startX} ${startY} C ${cp1x} ${startY}, ${cp2x} ${mouseY}, ${mouseX} ${mouseY}`);
                path.setAttribute('class', 'wire');
                path.setAttribute('stroke', '#66d9ef');
                svg.appendChild(path);
            }
        }

        function drawCurve(fromEl, toEl, color, index) {
            const r1 = fromEl.getBoundingClientRect();
            const r2 = toEl.getBoundingClientRect();
            const startX = r1.left + r1.width / 2 - panOffsetX;
            const startY = r1.top + r1.height / 2 - panOffsetY;
            const endX = r2.left + r2.width / 2 - panOffsetX;
            const endY = r2.top + r2.height / 2 - panOffsetY;

            const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
            const cp1x = startX + Math.abs(endX - startX) * 0.5;
            const cp2x = endX - Math.abs(endX - startX) * 0.5;
            path.setAttribute('d', `M ${startX} ${startY} C ${cp1x} ${startY}, ${cp2x} ${endY}, ${endX} ${endY}`);
            path.setAttribute('class', 'wire');
            path.setAttribute('stroke', color);
            path.setAttribute('data-index', index);
            svg.appendChild(path);
        }

        function evaluateGraph() {
            connections.forEach(conn => {
                const fromPort = document.querySelector(`[data-id="${conn.from}"]`);
                const toPort = document.querySelector(`[data-id="${conn.to}"]`);
                if (fromPort && toPort) {
                    const fromInp = fromPort.closest('.row').querySelector('input');
                    const toInp = toPort.closest('.row').querySelector('input');
                    if (fromInp && toInp) {
                        toInp.value = fromInp.value;
                    }
                }
            });
        }
    </script>
</body>
</html>
